; Runs both processes that make up the combined image. signal-cli starts first
; (lower priority number). go-signalium does NOT hard-depend on signal-cli at
; boot — its TCP client (internal/signal/tcp_client.go) dials in a background
; reconnect loop — but it DOES exit if Postgres is unreachable. startretries is
; raised well above the default of 3 so a dependency race (or the first-boot
; QR-linking window) doesn't drive a program to a permanent FATAL state; with
; autorestart=true it keeps retrying until its dependencies are up.
; supervisord passes its own environment to children, so SIGNALIUM_DB_URL set on
; the container reaches go-signalium. Both children log to the container's stdout.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:signal-cli]
command=/app/entrypoint_signal_cli.sh
priority=10
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:go-signalium]
command=/usr/local/bin/go-signalium
directory=/app
priority=20
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
